<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Para ela</title>
  <meta name="description" content="Entre com Supabase para ver e cuidar da listinha dela." />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet" />

  <!-- Estilos -->
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-wrapper">
    <!-- Header Simples -->
    <header class="site-header">
      <div class="container header-content">
        <a href="index.html" class="brand-link">
          <span class="brand-icon">
            <i data-lucide="heart" style="width: 20px; height: 20px;"></i>
          </span>
          <span class="brand brand-text">para ela<span class="brand-dot">.</span></span>
        </a>

        <a href="index.html" class="btn btn-ghost" style="font-size: 0.875rem;">
          <i data-lucide="arrow-left" style="width: 15px; height: 15px;"></i> Voltar
        </a>
      </div>
    </header>

    <!-- Card Centralizado -->
    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-icon">
          <i data-lucide="heart" style="width: 24px; height: 24px;"></i>
        </div>

        <h1 class="font-serif display-title" style="font-size: 1.875rem;">Nosso cantinho</h1>
        <p id="auth-subtitle" style="margin-top: 0.5rem; font-size: 0.875rem; color: var(--muted-foreground); line-height: 1.5;">
          Acesse com sua conta Supabase para ver e cuidar da listinha.
        </p>

        <div id="supabase-hint" class="auth-config-hint" style="display: none;">
          ℹ️ <strong>Modo Demonstração:</strong> Insira a URL e Chave Anon no arquivo <code>.env</code> para conectar ao seu projeto Supabase real.
        </div>

        <!-- Botão Principal: Continuar com o Google -->
        <button id="google-btn" class="google-btn" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true" class="google-icon">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2.5 24 .5 14.6.5 6.5 5.9 2.6 13.7l7.8 6.1C12.3 13.7 17.6 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.6-4.9 7.3l7.6 5.9c4.4-4.1 7.1-10.2 7.1-17.7z"/>
            <path fill="#FBBC05" d="M10.4 28.2a14.5 14.5 0 0 1 0-8.4l-7.8-6.1a24 24 0 0 0 0 20.6l7.8-6.1z"/>
            <path fill="#34A853" d="M24 47.5c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.2-8.3 2.2-6.4 0-11.7-4.2-13.6-10.3l-7.8 6.1C6.5 42.1 14.6 47.5 24 47.5z"/>
          </svg>
          Continuar com o Google
        </button>


        <!-- Mensagens de Alerta / Feedback -->
        <div id="auth-alert" class="auth-alert"></div>
      </div>
    </main>
  </div>

  <!-- Script TypeScript de Autenticação com Supabase -->
  <script type="module" src="/src/entrar.ts"></script>
</body>
</html>
